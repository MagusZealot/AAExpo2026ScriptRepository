<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="bakunawa%20on%20the%20clocktower%20v3_recolor_orange.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <img src="bakunawa%20on%20the%20clocktower%20v3_recolor_orange.png" alt="Logo" class="site-logo">
        <h1>Clocktower Manila Script Repository</h1>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar / Table of Contents -->
        <aside class="sidebar">
            <h3 id="tocToggle" class="toc-toggle-header" aria-expanded="true">Contents <span class="toggle-icon">&#9662;</span></h3>
            
            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-badge beginner"></span>
                    <span><strong id="beginnerCount">0</strong> <span class="difficulty-text">Beginner</span></span>
                </div>
                <div class="stat-item">
                    <span class="stat-badge intermediate"></span>
                    <span><strong id="intermediateCount">0</strong> <span class="difficulty-text">Intermediate</span></span>
                </div>
                <div class="stat-item">
                    <span class="stat-badge expert"></span>
                    <span><strong id="expertCount">0</strong> <span class="difficulty-text">Expert</span></span>
                </div>
            </div>

            <div class="stat-divider" aria-hidden="true">
                <img src="divider.png" alt="" class="divider-img">
            </div>

            <div id="tocWrapper" class="toc-wrapper">
                <ul class="toc-list" id="tocList">
                    <!-- Generated dynamically -->
                </ul>
            </div>
        </aside>
        <div id="sidebarScrim" class="sidebar-scrim" aria-hidden="true"></div>
        <button id="sidebarHandle" class="sidebar-handle" type="button" aria-label="Open contents" aria-controls="tocList" aria-expanded="false"></button>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search Bar -->
            <div class="search-container">
                <label for="searchInput">Search Scripts</label>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by title, author, character, or difficulty..."
                    aria-label="Search scripts by title, author, key characters, or difficulty"
                >
                <p class="search-hint">Search filters by title, author, characters, description, and difficulty levels.</p>
            </div>

            <!-- Scripts Grid -->
            <div class="scripts-grid" id="scriptsGrid">
                <!-- Generated dynamically -->
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Clocktower Manila Scripts Repository</p>
    </footer>

    <button id="scrollTopButton" class="scroll-top-button" type="button" aria-label="Scroll to top" title="Top">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"></path>
            <path d="M5 12l7-7 7 7"></path>
        </svg>
    </button>
    <script src="app.js" defer></script>

</body>
</html>
